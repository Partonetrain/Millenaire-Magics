#Whether or not to enable rarity tweak
"Rarity tweak" = true
#If true, enchantments cannot alter an ItemStack's rarity
#This is recommended if Rarity Tagging is enabled, but is not required (in this case, enchanted & tagged items will have their rarity upgraded)
"Prevent Enchantment Altering" = true
#If true, any item in one of the following item tags will automatically have its rarity set to that rarity (on item/item entity tick)
#trains_tweaks:common, trains_tweaks:uncommon, trains_tweaks:rare, trains_tweaks:epic
#These tags potentially have a performance impact, so they should be used sparingly
"Rarity Tagging" = true
#If enabled, any item that isn't in one of the rarity tags that has had its rarity component modified (or removed) will automatically have its rarity be reset
#Requires Rarity Tagging to be true, and completely ignores enchantments
"Restore Default Rarity" = false
#If enabled, ItemStacks will ONLY check for their presence in one of the rarity tags and ignore the rarity component AND enchantments entirely
#Although it makes it seem more seamless, this is not recommended, because the stack won't actually be updated, and you will have to re-tag every item with non-Common rarity
#You should disable Rarity Tagging, Prevent Enchantment Altering, and Restore Default Rarity when turning this on
"ItemStacks Check Tag" = false
