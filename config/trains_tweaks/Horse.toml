#Whether or not to enable any tweaks relating to horses and related mobs
"Horse Tweaks" = true
#If set to true, a bred horse's stats will never have a random variation that makes that stat worse than the average of its parents
"Guarantee Greater Than Or Equal To Stats" = true
#Newly-spawned horses (including offspring) with a health value lower than this will have their health upped to this minimum
#For reference, the average is ~22.5
#Leave as default for vanilla value
# Default: 15.0
# Range: 15.0 ~ 30.0
"Horse Health Minimum" = 22.5
#Newly-spawned horses (including offspring) with a speed value lower than this will have their speed upped to this minimum
#For reference, the average is ~0.225, or 9.49 blocks/sec
#Leave as default for vanilla value
# Default: 0.1125
# Range: 0.1125 ~ 0.3375
"Horse Speed Minimum" = 0.225
#Newly-spawned horses (including offspring) with a jump value lower than this will have their jump upped to this minimum
#For reference, the average is ~0.7, or 2.89 blocks (does not scale linearly)
#Leave as default for vanilla value
# Default: 0.4
# Range: 0.4 ~ 1.0
"Horse Jump Minimum" = 0.7
#Newly-spawned llamas (including offspring) with a strength value lower than this will have their strength upped to this minimum
#Set to 0 to disable
# Default: 0
# Range: 0 ~ 5
"Llama Strength Minimum" = 3
