[General]
	#If true, prevent all hopper interactions with Locked Chests
	#Locked Chests should not work with standard modded item transfers (i.e., Create chutes) regardless of this config, because they lack Capabilities
	#They only work with hoppers by default due to inheriting vanilla chest code
	#However, other modded hoppers may or may not be affected by this - it depends on how they were implemented
	"Prevent Hopper Interactions" = true
	#If true, Millenaire foods will use vanilla food components
	#This can enhance compatibility with mods like AppleSkin
	#However, other mods that utilize this component probably will not correctly account for the food's durability
	"Use Food Components" = true
	#If true, Yogurt and Curry will give the player a bowl after it is eaten (only in survival)
	"Food Gives Bowl" = true
	#If true, all drinks will give the player a glass bottle after it is drunk (only in survival)
	"Drink Gives Bottle" = true
	#If true, any Inuit Tridents obtained by survival mode players will behave like a Minecraft trident instead of a sword
	#WARNING: this auto-replaces millenaire:inuittrident in player inventories with cle:inuit_trident
	"Alternative Inuit Trident" = true
	#If true, any Mayan or Byzantine Maces obtained by survival mode players will behave like a Minecraft mace instead of a sword
	#WARNING: this auto-replaces millenaire:mayan_mace and millenaire:byzantine_mace in player inventories with the Cle versions
	"Alternative Maces" = true
	#If true, any alternative items that are enabled will also be converted in Millager inventories
	#This doesn't have much of an effect in practice, only increasing damage for relevant millagers
	"Convert Alternative Items on Millagers" = true
	#If true, enables a datapack containing composter values for Millenaire crops and related blocks will be enabled
	"Compost Datapack" = true
	#Entities in the entity type tag cle:millagers_deal_modified_damage_to will take modified damage when attacked by millagers
	#The format of this is (operation)(value), so for example "x2" will make entities take twice as much damage and "+2" will make entities take 2 more damage
	"Modified Damage Dealt" = "x2"
	#Entities in the entity type tag cle:millagers_take_modified_damage_from will deal modified damage when attacking millagers
	#The format is the same as above
	"Modified Damage Received" = "/2"
	#If true, any entity in the the entity type tag cle:hunts_millagers will hunt millagers, even if their original logic said they should not
	#(This is a config option unlike the other tags because it has the potential to introduce lag)
	"Hunts Millagers" = true
	#If true, any entity in the the entity type tag cle:hunts_millagers will despawn if it enters a millage
	#(Similar to Hunts Millagers, this has the potential to introduce lag)
	"Despawns In Millage" = true
	#If greater than -1, the maximum amount of reputation a player can gain with per village per Minecraft day
	#This can be used to ensure players don't just dump stacks of donations into a village and instantly be considered friends
	#For reference, the reputation 'FRIEND OF THE VILLAGE' happens at 8192 points, and the reputation 'ONE OF US' happens at 32768 points
	#This also affects player reputation for entire culture; a tenth of all reputation gained at a village is gained as culture reputation
	# Default: -1
	# Range: -1 ~ 32768
	"Reputation Cap per Day" = 8192
	#If not 0, the max distance from world spawn at which Millenaire villages and long buildings can generate
	#This can be used in combination with the spawnProtectionRadius option in Millenaire server config to define a square region around world spawn in which villages are allowed to generate
	# Default: 0
	# Range: 0 ~ 12550821
	"Max Radius" = 12550000
	#If true, Millenaire's Travel Book will open the Millenaire Info Panel instead of the Travel Book screen
	#(While this is enabled the Travel Book can still be opened from the Info Panel, or by shift-right-clicking with the book)
	"Travel Book Info Panel" = true
	#If true, Grape Vines will be right-clickable like Sweet Berry Bushes if the player has learned how to plant grapes
	#(It seems unintentional that it isn't like this by default: Grape Vine block extends BushBlock, but it doesn't override useWithoutItem)
	"Grape Vine Right Click" = true

[Client]
	#If this option is not empty, the Constructions panel in any town hall will attempt to sort its list by moving items that contain matching strings in its target to the bottom
	#This should make more important buildings appear first and less important buildings appear last
	#Separate entries by comma. Entries should not include spaces.
	"Sort Constructions Panel" = "wall,tower"
	#If true, Millenaire's keybindings will not be registered
	#There is currently no alternative to the Stance key, however
	"Prevent Keybindings" = false

[Malum]
	#The amount of reputation lost for reaping Spirits nearby a millager
	#Set to -1 for no loss
	# Default: 4
	# Range: -1 ~ 8192
	"Spirit Reap Reputation Loss" = 4

