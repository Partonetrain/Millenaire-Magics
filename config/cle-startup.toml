[Quark]
	#Cle makes Quark's Simple Harvest feature always check if players have the requisite knowledge of a Millenaire crop before letting them harvest
	#However, non-players (i.e., fake players and other automated right-click blocks) are in theory still capable of triggering this check, which would always fail.
	#Setting this to true allows non players to simple harvest
	"Simple Harvest Non Players" = false
